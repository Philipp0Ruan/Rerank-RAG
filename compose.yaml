name: rerank-rag
services:
  rag:
    network_mode: none
    build:
      context: .
      target: simulation
    image: rerank-rag:simulation
    volumes:
      - ./results:/app/results
  notebook:
    build:
      context: .
      target: simulation
    image: rerank-rag:simulation
    profiles: [notebook]
    command: [python, -m, jupyterlab, --ip=0.0.0.0, --port=8888, --no-browser, --ServerApp.root_dir=/app]
    ports:
      - "127.0.0.1:8890:8888"
    volumes:
      - ./results:/app/results
      - ./notebooks:/app/notebooks
  real:
    profiles: [real]
    build:
      context: .
      target: runtime
    image: rerank-rag:runtime
    command: [python, rerank_rag.py, avaliar]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./results:/app/results
      - ./.cache:/app/.cache
